    <meta name="color-scheme" content="light dark" />
    <script>
      // A theme chosen with the top-bar button, applied before first paint.
      // With nothing saved, the visitor's system setting decides (see index.css).
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch { /* storage blocked: follow the system setting */ }
    </script>
    <title>TRINITY: Feedback-driven bubble evolution</title>
